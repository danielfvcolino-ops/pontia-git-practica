name: Demo manual

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: 'Mensaje que se imprimira por consola'
        required: true
        default: 'Hola desde GitHub Actions'
        type: string

jobs:
  imprimir:
    runs-on: ubuntu-latest
    steps:
      - name: Imprimir el mensaje recibido
        run: echo "Mensaje recibido: ${{ inputs.mensaje }}"
